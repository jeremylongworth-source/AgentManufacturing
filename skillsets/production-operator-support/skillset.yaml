{
  "schema_version": "AM-28-skillset-1",
  "name": "production-operator-support",
  "description": "Support an operator's documented work and shift handoff.",
  "status": "STRUCTURALLY_READY",
  "license": "MIT",
  "composition_contract": "../composition-contract.json",
  "skills": [
    "review-document-revision",
    "review-work-instruction",
    "review-operator-checklist",
    "analyze-standard-work-deviation",
    "prepare-shift-handoff"
  ],
  "workflows": [
    {
      "id": "work-review",
      "trigger": "Review the supplied operator instruction and checklist.",
      "required_inputs": "Current document revision, task and checklist.",
      "skills": [
        "review-document-revision",
        "review-work-instruction",
        "review-operator-checklist"
      ],
      "output": "Document/checklist evidence gaps.",
      "review_boundary": "Do not modify an approved instruction or authorize machine operation."
    },
    {
      "id": "shift-handoff",
      "trigger": "Summarize production events and unresolved deviations.",
      "required_inputs": "Shift records, deviation evidence and next-shift context.",
      "skills": [
        "analyze-standard-work-deviation",
        "prepare-shift-handoff"
      ],
      "output": "Draft handoff with deviations and owners.",
      "review_boundary": "Do not infer permission to continue unsafe work."
    }
  ]
}
